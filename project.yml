name: Monthlio
options:
  bundleIdPrefix: com.monthlio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Monthlio:
    type: application
    platform: iOS
    sources:
      - path: Monthlio
    info:
      path: Monthlio/Info.plist
      properties:
        CFBundleDisplayName: Monthlio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Monthlio uses Face ID to keep your expenses private.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Monthlio/Monthlio.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.monthlio.app
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monthlio.app
        DEVELOPMENT_TEAM: Y5866VXSB9
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MonthlioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MonthlioTests
    dependencies:
      - target: Monthlio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monthlio.app.tests
        DEVELOPMENT_TEAM: Y5866VXSB9
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Monthlio:
    build:
      targets:
        Monthlio: all
        MonthlioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MonthlioTests
    profile:
      config: Release
    archive:
      config: Release
