name: Monthlio
options:
  bundleIdPrefix: com.monthlio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Monthlio:
    type: application
    platform: iOS
    sources:
      - path: Monthlio
    info:
      path: Monthlio/Info.plist
      properties:
        CFBundleDisplayName: Monthlio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Monthlio uses Face ID to keep your expenses private.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.monthlio.app
            CFBundleURLSchemes:
              - monthlio
    entitlements:
      path: Monthlio/Monthlio.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.monthlio.app
        com.apple.security.application-groups:
          - group.com.monthlio.app
        aps-environment: development
    dependencies:
      - target: MonthlioWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monthlio.app
        DEVELOPMENT_TEAM: Y5866VXSB9
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MonthlioWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MonthlioWidget
      - path: Monthlio/Widgets
      - path: Monthlio/Models/ExpenseCategory.swift
      - path: Monthlio/Resources/Localizable.xcstrings
    info:
      path: MonthlioWidget/Info.plist
      properties:
        CFBundleDisplayName: Monthlio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MonthlioWidget/MonthlioWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.monthlio.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monthlio.app.widget
        DEVELOPMENT_TEAM: Y5866VXSB9
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO

  MonthlioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MonthlioTests
      - path: StoreKit/Monthlio.storekit
        buildPhase: resources
    dependencies:
      - target: Monthlio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monthlio.app.tests
        DEVELOPMENT_TEAM: Y5866VXSB9
        GENERATE_INFOPLIST_FILE: YES

  MonthlioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MonthlioUITests
    dependencies:
      - target: Monthlio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monthlio.app.uitests
        DEVELOPMENT_TEAM: Y5866VXSB9
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Monthlio

schemes:
  Monthlio:
    build:
      targets:
        Monthlio: all
        MonthlioWidget: all
        MonthlioTests: [test]
        MonthlioUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Monthlio.storekit
    test:
      config: Debug
      storeKitConfiguration: StoreKit/Monthlio.storekit
      targets:
        - MonthlioTests
        - MonthlioUITests
    profile:
      config: Release
    archive:
      config: Release
